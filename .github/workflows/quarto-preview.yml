name: Quarto redesign preview (no deployment)

on:
  push:
    branches:
      - quarto-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render standalone Quarto preview
        run: quarto render
      - name: Upload preview website (does not publish)
        uses: actions/upload-artifact@v4
        with:
          name: quarto-redesign-preview
          path: _site/
          if-no-files-found: error
